name: Build EnrollSync

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 32-bit Python: the ZKTeco SDK (zkemkeeper.dll) is 32-bit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywin32 openpyxl xlrd selenium

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name EnrollSync
          --collect-all selenium
          --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes
          --hidden-import openpyxl --hidden-import xlrd
          enroll_sync.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: EnrollSync
          path: dist/EnrollSync.exe
